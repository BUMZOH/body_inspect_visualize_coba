<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボディ検査装置 稼働データ入力画面</title>
    <link rel="icon" href="data:,"> <!--エラー表示対策-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="title-area">
        <h1>
            <span data-en="Body Inspection Machine Operation Data Entry">ボディ検査装置 稼働データ入力画面</span>
            <span class="version">Ver.2026072901</span>
        </h1>
    
        <div class="language-button-area">
            <button id="english_button" type="button">ENGLISH</button>
            <button id="japanese_button" type="button">日本語</button>
        </div>
    </header>


    <!------- データ入力部 ------->
    <div class="form-area">
        <!-- 1段目 --------------------------------------------------->
        <div class="form-item">
            <label for="inspection_machine_no" data-en="Inspection Machine No:">検査機番：</label>
            <input id="inspection_machine_no" type="text" readonly>
        </div>

        <div class="form-item">
            <label for="record_date" data-en="Record Date:">記録日：</label>
            <input id="record_date" type="date">
        </div>

        <div class="form-item">
            <label for="shift_name" data-en="Shift:">シフト：</label>
            <select name="" id="shift_name">
                <option value=""></option>
                <option value="昼勤">昼勤</option>
                <option value="夜勤">夜勤</option>
            </select>
        </div>

        <div class="form-item">
            <label for="part_no" data-en="Part No:">品番：</label>
            <input id="part_no" type="text" readonly>
        </div>

        <div class="form-item">
            <label for="nc_process_date" data-en="NC Process Date:">NC加工日：</label>
            <input id="nc_process_date" type="date">
        </div>

        <div class="form-item">
            <label for="nc_machine_no" data-en="NC Machine No:">NC機番：</label>
            <input id="nc_machine_no" type="text" placeholder="手入力">
        </div>

        <div class="form-item">
            <label for="monthly_serial_no" data-en="Monthly Serial No:">月別通しNo：</label>
            <input id="monthly_serial_no" type="text" readonly>
        </div>

        <div class="form-item">
            <label for="inspection_start_time" data-en="Inspection Start Time:">検査開始時間：</label>
            <input id="inspection_start_time" type="datetime-local" step="60">
        </div>

        <div class="form-item">
            <label for="inspection_end_time" data-en="Inspection End Time:">検査終了時間：</label>
            <input id="inspection_end_time" type="datetime-local" step="60">
        </div>

        <!-- 2段目 --------------------------------------------------->
        <div class="form-item">
            <label for="change_point_record" data-en="Change Point Record:">変化点記録：</label>
            <select name="" id="change_point_record">
                <option value=""></option>
                <option value="社内">社内</option>
                <option value="柴田外観あり">柴田外観あり</option>
                <option value="柴田外観なし">柴田外観なし</option>
            </select>
        </div>

        <div class="form-item">
            <label for="camera_threshold" data-en="Camera Threshold:">カメラしきい値：</label>
            <select name="" id="camera_threshold">
                <option value=""></option>
                <option value="正常">正常</option>
                <option value="変更有">変更有</option>
            </select>
        </div>

        <div class="form-item">
            <label for="worker_name" data-en="Worker:">担当者：</label>
            <input id="worker_name" type="text" placeholder="バーコード入力">
        </div>

        <div class="form-item">
            <label for="appearance_check" data-en="Appearance Check:">外観チェック：</label>
            <select name="" id="appearance_check">
                <option value=""></option>
                <option value="正常">正常</option>
                <option value="異常">異常</option>
            </select>
        </div>

        <div class="form-item">
            <label for="appearance_checker" data-en="Appearance Checker:">外観チェック者：</label>
            <input id="appearance_checker" type="text" placeholder="バーコード入力">
        </div>

        <div class="form-item">
            <label for="setup_check" data-en="Setup Check:">段取時確認作業：</label>
            <select name="" id="setup_check">
                <option value=""></option>
                <option value="あり">あり</option>
                <option value="なし">なし</option>
            </select>
        
        </div>

        <div class="form-item">
            <label for="remaining_checker" data-en="Remaining Part Checker:">残留品確認者：</label>
            <input id="remaining_checker" type="text">
        </div>

        <div class="form-item">
            <label for="camera_5st_checker" data-en="5ST Camera Checker:">5STカメラ確認者：</label>
            <input id="camera_5st_checker" type="text">
        </div>

        <div class="form-item">
            <label for="remaining_double_checker" data-en="RemainingPt WChecker:">残留品Wチェック者：</label>
            <input id="remaining_double_checker" type="text" placeholder="バーコード入力">
        </div>

        <!-- 3段目 --------------------------------------------------->
        <div class="form-item">
            <label for="drop_count" data-en="Dropped Part Count:">落下品数：</label>
            <input id="drop_count" type="text" placeholder="手入力">
        </div>

        <div class="form-item note">
            <label for="abnormal_report" data-en="Change Point / Abnormal Report:">変化点／異常報告：</label>
            <input id="abnormal_report" type="text">
        </div>
    </div>

    <hr>

    <!------- テーブル表示部 ------->
    <div class="table-area">
        <h2 data-en="OK / NG Count">良品数／不良品数</h2>
        <table id="count_summary">
            <tr>
                <th data-en="OK Count">良品数</th>
                <th data-en="NG Count">不良数</th>
            </tr>
            <tr>
                <td id="ok_count" class="db-item">0</td>
                <td id="ng_count" class="db-item">0</td>
            </tr>
        </table>

        <h2 data-en="NG Count by Item">項目別不良数</h2>
        <table id="ng_count_detail">
            <tr>
                <th data-en="Inspection Item">検査項目</th>
                <th data-en="Inner Diameter">内径</th>
                <th data-en="φ0.71">φ0.71</th>
                <th data-en="Overall Length">全長</th>
                <th data-en="Taper Thickness">テーパ厚み</th>
                <th data-en="Level Gap">段差</th>
                <th data-en="Bottom">底</th>
                <th data-en="Thickness">厚み</th>
                <th data-en="Side 1">側面1</th>
                <th data-en="Side 2">側面2</th>
                <th data-en="φ2.435 Depth">φ2.435深さ</th>
                <th data-en="φ1.4 Depth">φ1.4深さ</th>
            </tr>
            <tr>
                <th data-en="Initial Inspection">初回検査時</th>
                <td id="inner_d_ngcount1" class="db-item">0</td>
                <td id="phi071_ngcount1" class="db-item">0</td> 
                <td id="total_length_ngcount1" class="db-item">0</td> 
                <td id="taper_thickness_ngcount1" class="db-item">0</td>
                <td id="level_gap_ngcount1" class="db-item">0</td>
                <td id="bottom_ngcount1" class="db-item">0</td>
                <td id="thickness_ngcount1" class="db-item">0</td>
                <td id="side_visual1_ngcount1" class="db-item">0</td>
                <td id="side_visual2_ngcount1" class="db-item">0</td>
                <td id="phi2435_depth_ngcount1" class="db-item">0</td> 
                <td id="phi14_depth_ngcount1" class="db-item">0</td> 
            </tr>
            <tr>
                <th data-en="Reinspection">再検査時</th>
                <td id="inner_d_ngcount2" class="db-item">0</td>
                <td id="phi071_ngcount2" class="db-item">0</td>
                <td id="total_length_ngcount2" class="db-item">0</td>
                <td id="taper_thickness_ngcount2" class="db-item">0</td>
                <td id="level_gap_ngcount2" class="db-item">0</td>
                <td id="bottom_ngcount2" class="db-item">0</td>
                <td id="thickness_ngcount2" class="db-item">0</td>
                <td id="side_visual1_ngcount2" class="db-item">0</td>
                <td id="side_visual2_ngcount2" class="db-item">0</td>
                <td id="phi2435_depth_ngcount2" class="db-item">0</td> 
                <td id="phi14_depth_ngcount2" class="db-item">0</td> 
            </tr>
        </table>

        <h2 data-en="Alarm Count by Station">ステーション別アラーム発生数</h2>
        <table id="alarm_info">
            <tr>
                <th>1ST</th>
                <th>2ST</th>
                <th>3ST</th>
                <th>4ST</th>
                <th>5ST</th>
                <th>6ST</th>
                <th>7ST</th>
                <th>8ST</th>
                <th data-en="Others">その他</th>
            </tr>
            <tr>
                <td id="st1_alarm_count" class="db-item">0</td>
                <td id="st2_alarm_count" class="db-item">0</td>
                <td id="st3_alarm_count" class="db-item">0</td>
                <td id="st4_alarm_count" class="db-item">0</td>
                <td id="st5_alarm_count" class="db-item">0</td>
                <td id="st6_alarm_count" class="db-item">0</td>
                <td id="st7_alarm_count" class="db-item">0</td>
                <td id="st8_alarm_count" class="db-item">0</td>
                <td id="others_alarm_count" class="db-item">0</td>
            </tr>
        </table>
    </div>
    <br>
    <hr>

    <div class="button-area">
        <div class="button-group-left">
            <button id="backup_button" data-en="Backup">バックアップ</button>
            <button id="export_alarm_comment_button" data-en="Export Alarm Comment">ｱﾗｰﾑｺﾒﾝﾄ吸出し</button>
            <button id="export_data_button" data-en="Export Data">データ出力</button>
        </div>

        <div class="button-group-right">
            <button id="initialize_button" data-en="Initialize Data">データ初期化</button>
            <button id="update_button" data-en="Update Data">データ更新</button>
            <button id="register_button" data-en="Register Data">データ登録</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
